<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mana - 聯絡我們</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="container nav-wrap">
            <div class="logo">mana</div>
            <nav>
                <ul>
                    <li><a href="index.html">公司簡介</a></li>
                    <li><a href="products.html">商品介紹</a></li>
                    <li><a href="contact.html" class="active">聯絡我們</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>聯絡我們</h1>
            <p>期待與您在此相遇，共享一杯寧靜</p>
        </div>

        <div class="contact-section">
            <div class="contact-info">
                <p>地址：台北市靜思巷 1 號</p>
                <p>營業時間：週三至週日 10:00 - 18:00 (週一、週二定休)</p>
                <p>電子郵件：hello@manacoffee.tw</p>
            </div>

            <form id="contact-form">
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" name="name" required placeholder="請輸入您的稱呼">
                </div>
                <div class="form-group">
                    <label for="email">電子信箱</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label for="phone">聯絡電話</label>
                    <input type="tel" id="phone" name="phone" required placeholder="請輸入聯絡電話">
                </div>
                <div class="form-group">
                    <label for="message">留言內容</label>
                    <textarea id="message" name="message" rows="5" required placeholder="請輸入您想告訴我們的話..."></textarea>
                </div>
                <button type="submit" id="submit-btn">發送訊息</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 mana coffee. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // 將您貼上的字串轉換為完整的 Google Apps Script 執行網址
        const scriptId = 'AKfycbwijpze2iaqUs9VWwdpGZx84-N5RVAHLDCQLAgbnkRAa4gz2sxY3hDLrAPVHFXbRxBU';
        const scriptURL = `https://script.google.com/macros/s/${scriptId}/exec`;
        const form = document.getElementById('contact-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', e => {
            e.preventDefault();

            submitBtn.textContent = '發送中...';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form), mode: 'no-cors' })
                .then(response => {
                    alert('感謝您的來信，我們將盡快回覆您！');
                    form.reset();
                    submitBtn.textContent = '發送訊息';
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('發生錯誤，請稍後再試！');
                    submitBtn.textContent = '發送訊息';
                    submitBtn.disabled = false;
                });
        });
    </script>

</body>
</html>
